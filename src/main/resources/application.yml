server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

milvus:
  enable: true
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

spring:
  ai:
    dashscope:
      api-key: ${ALI_API_KEY}
      chat:
        options:
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2
          multiplier: 2
          max-interval: 10000
        embedding:
          options:
            model: text-embedding-v4

    # Spring AI MCP 客户端配置
    # 已禁用：腾讯云 CLS MCP 服务不可用
    mcp:
      client:
        enabled: false
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: /sse/b5cad1b17a11dd82  # 完整的SSE端点路径

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3-max"  # 大语言模型名称
  similarity-threshold: 1.0  # 相似度阈值（L2 距离，越小越相似，建议 0.5-1.5）
  use-rerank: true  # 是否启用Rerank重排序
  rerank-candidate-multiplier: 5  # Rerank候选文档倍数（top-k * multiplier = 召回数量）
  use-hybrid-search: true  # 是否启用混合检索（向量+关键词）

# Rerank 配置
rerank:
  enabled: true  # 是否启用Rerank服务
  model: "gte-rerank"  # Rerank模型名称
  top-n: 3  # Rerank后返回的文档数量
  candidate-multiplier: 5  # 候选文档倍数

# 关键词检索配置
keywordsearch:
  enabled: true  # 是否启用关键词检索
  top-k: 20  # 关键词检索返回数量
  min-keyword-length: 2  # 最小关键词长度
  use-bm25-simulation: true  # 是否使用BM25分数计算

# 混合检索配置
hybridsearch:
  enabled: true  # 是否启用混合检索
  rrf-k: 60  # RRF融合常数
  vector-weight: 0.6  # 向量检索权重（加权融合模式）
  keyword-weight: 0.4  # 关键词检索权重（加权融合模式）
  use-rrf: true  # true使用RRF融合，false使用加权融合

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 关闭 Mock 模式，使用真实 Prometheus 数据

# Loki 日志服务配置
loki:
  base-url: http://localhost:3100
  timeout: 10
  enabled: true  # 启用 Loki 日志查询

# yingmuTV 配置
dokitv:
  mock-enabled: true

# CLS 云日志服务配置
cls:
  mock-enabled: true  # 启用 Mock 模式，使用本地 Loki 日志数据
  # 注意：当前未配置真实 CLS 连接，使用 Mock 数据演示
